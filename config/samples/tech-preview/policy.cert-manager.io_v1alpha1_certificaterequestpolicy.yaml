apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: example-policy
spec:
  allowed:
    dnsNames:
      values:
        - "*.svc.cluster.local"
      required: true
      validations:
        - rule: self.endsWith('.' + cr.namespace + '.svc.cluster.local')
          message: DNS names must belong to the request namespace
    usages:
      - digital signature
      - key encipherment
      - server auth
  constraints:
    minDuration: 1h
    maxDuration: 24h
    privateKey:
      algorithm: RSA
      minSize: 2048
      maxSize: 4096
  selector:
    issuerRef:
      group: cert-manager.io
      kind: Issuer
      name: app-ca
    namespace:
      matchNames:
        - example-apps
