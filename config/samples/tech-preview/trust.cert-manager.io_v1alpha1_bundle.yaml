apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  labels:
    app.kubernetes.io/name: bundle
    app.kubernetes.io/part-of: trust-manager
  name: example-bundle
spec:
  sources:
    - useDefaultCAs: true
  target:
    configMap:
      key: ca-certificates.crt
    secret:
      key: ca-certificates.crt
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: openshift-network-console
