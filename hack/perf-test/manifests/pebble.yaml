apiVersion: v1
kind: Namespace
metadata:
  name: pebble
  labels:
    purpose: acme-test-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pebble-config
  namespace: pebble
data:
  pebble-config.json: |
    {
      "pebble": {
        "listenAddress": "0.0.0.0:14000",
        "managementListenAddress": "0.0.0.0:15000",
        "certificate": "/test/certs/localhost/cert.pem",
        "privateKey": "/test/certs/localhost/key.pem",
        "httpPort": 5002,
        "tlsPort": 5001,
        "ocspResponderURL": "",
        "externalAccountBindingRequired": false,
        "domainBlocklist": [],
        "retryAfter": {
          "authz": 1,
          "order": 1
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: pebble
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:latest
          command: ["/app"]
          args:
            - -config
            - /etc/pebble/pebble-config.json
            - -dnsserver
            - 127.0.0.1:8053
          env:
            - name: PEBBLE_VA_NOSLEEP
              value: "1"
            - name: PEBBLE_VA_ALWAYS_VALID
              value: "1"
          ports:
            - containerPort: 14000
              name: acme
            - containerPort: 15000
              name: management
          volumeMounts:
            - name: config
              mountPath: /etc/pebble
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: pebble-config
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: pebble
spec:
  selector:
    app: pebble
  ports:
    - name: acme
      port: 14000
      targetPort: 14000
    - name: management
      port: 15000
      targetPort: 15000
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: perf-test-acme-pebble
spec:
  acme:
    server: https://pebble.pebble.svc.cluster.local:14000/dir
    skipTLSVerify: true
    privateKeySecretRef:
      name: perf-test-acme-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: openshift-default
