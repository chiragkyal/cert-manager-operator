apiVersion: operator.openshift.io/v1alpha1
kind: CertManager
metadata:
  name: cluster
spec:
  managementState: Managed
  logLevel: Normal
  unsupportedConfigOverrides:
    controller:
      args:
        - "--kube-api-qps=100"
        - "--kube-api-burst=200"
    webhook:
      args: []
    cainjector:
      args: []
