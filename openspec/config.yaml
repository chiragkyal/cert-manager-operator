schema: openspec-agile-workflow

context: |
  GS Spec Kit agile workflow — gated spec-driven development.
  Stages: validation → specs → repo-assessment + constitution → plan → tasks → implementation.
  Primary input at /opsx:new: Jira ticket key ONLY (stored in inputs/jira.yaml).
  Target GitHub repository: NOT required at /opsx:new — required before repo-assessment artifact.
  agents.md: read from operator repo root (working directory).
  constitution.md: read from harness-evals/constitution.md (generated by /opsx-constitute).
  Fork URL: NOT required until Implementation (/opsx:apply) — stored as fork_repo_url in inputs/jira.yaml.
  Approve each artifact before proceeding to the next stage. Implementation uses
  task-by-task execution (/opsx-apply) with per-task approval (auto when auto_approve: true), then prompts the user
  to raise a draft PR from the user's fork to the upstream repo.

flags:
  # codegen_mode controls the implementation phase strategy:
  #   "ai-helpers" — OAPE command routing + code-generation eval gate (design-bundle per task,
  #                  specialized Cursor commands for API/controller/e2e generation, eval scoring)
  #   "direct"     — plain agent implementation (reads context files, applies FILE OPERATIONS
  #                  directly, no OAPE commands, no code eval gate)
  codegen_mode: direct
  auto_approve: true              # true = auto-approve artifacts + per-task code (/opsx-continue, /opsx-apply). Phase approval, PR creation, and Jira creation are NEVER auto-approved.
  max_feedback_rounds: 3          # Max user rejection + refinement loops per artifact before halting (USER_FEEDBACK_PROMPT.md)
  exit_on_all_tasks_complete: true # Exit implementation stage automatically when all tasks in tasks.md are marked [x]
  generate_evaluation_reports: true # Generate <artifact>_evaluation_report.md alongside each artifact
  # task_execution_mode controls how tasks.md is generated and implemented:
  #   "one-shot"        — generate ALL tasks for ALL plan phases at once, implement sequentially,
  #                       single PR at the end
  #   "phase-iterative" — generate and implement tasks one plan phase at a time, optional PR per phase
  task_execution_mode: phase-iterative   # one-shot | phase-iterative
  pr_between_phases: optional            # optional | mandatory | none (phase-iterative only)
  task_sizing:
    prompt_user: true
    default_min: 2
    default_max: 3
    consolidation_threshold: 2

# User credentials (fill before /opsx-apply or /opsx-e2e)
credentials:
  jira:
    base_url: ""          # e.g. https://issues.redhat.com
    username: ""
    api_token: ""         # Jira PAT or API token
  github:
    fork_repo_url: ""     # e.g. https://github.com/sujkini/zero-trust-workload-identity-manager
    upstream_repo_url: "" # e.g. https://github.com/openshift/zero-trust-workload-identity-manager
    token: ""             # GitHub PAT (for cross-repo PR creation)
  cluster:
    kubeconfig_path: ""   # absolute path to kubeconfig for E2E execution

rules:
  validation:
    - "Read jira_key from inputs/jira.yaml; use inputs/jira-spec.md as spec source"
    - "Obtain Jira ticket content via Jira MCP or ask the user to paste into inputs/jira-spec.md"
    - "Score completeness (60%) and quality (40%); do not invent requirements"
    - "Emit validation.json matching the validation.md template schema"
  specs:
    - "Derive from the same Jira ticket referenced in inputs/jira.yaml"
    - "No implementation details; max 3 [NEEDS CLARIFICATION] markers"
    - "User stories with Given/When/Then; FR-xxx and SC-xxx identifiers"
    - "If user rejects specs.md at approval, exit the workflow (no refinement loop; see schema exit_on_reject.specs)"
  repo-assessment:
    - "Before creating repo-assessment.md, ensure target_repo is set in inputs/jira.yaml"
    - "Fact-based inventory only; cite repo evidence for every target file"
  constitution:
    - "INPUT not artifact — read from harness-evals/constitution.md"
    - "If not found or empty, stop and prompt user to run /opsx-constitute or place it manually"
  plan:
    - "All sections §0–§8; each phase uses Goal, Dependencies, Target files, Verification hooks"
    - "1:1 user story to phase mapping; number of phases equals number of user stories in specs.md"
    - "Jira Story creation only when input ticket is an Epic (jira_issuetype == Epic)"
  tasks:
    - "Use §0–§5 structure; prefer multipass (skeleton → payloads → orchestration) for large backlogs"
    - "Task IDs: T<n>_<m>; unit tests are co-generated per task (not separate tasks); phase-scoped when task_execution_mode = phase-iterative"
  implementation:
    - "Follow the implementation artifact instruction in schema.yaml exactly"
    - "Ask user for fork_repo_url at stage start if not set; persist to inputs/jira.yaml"
    - "Clone fork, create feature branch, apply FILE OPERATIONS to fork working copy (not upstream)"
    - "Task-by-task execution with per-task approval gate (auto when auto_approve: true; codegen_mode selects OAPE commands or direct agent implementation)"
    - "Every Tier 1 implementation task must co-generate _test.go files and run go test; follow agents.md test exemplar; separate tasks only for e2e tests"
    - "After all phases: prompt user to raise draft PR from fork to upstream (user can decline)"
    - "Close when all tasks are approved and per-task reports exist under implementation/task-reports/"
